name: pages

# Publica el sitio (solo el frontend estático) en la rama gh-pages para GitHub Pages.
# La API vive aparte (Render); su URL se lee de la variable de repositorio PUBLIC_API_BASE_URL
# (Settings → Secrets and variables → Actions → Variables). No es un secreto: es la URL pública
# de la API, nunca una llave. Sin esa variable, el sitio se publica igual pero sin backend en vivo
# (Sofía responde con el motor local, y el formulario y la reserva no se pueden enviar).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run build:pages
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      - name: Sin llaves en el sitio publicado
        run: |
          ! grep -rEn 'gsk_[A-Za-z0-9]{16,}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9_-]{20,}' dist/
      - name: Publicar en gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: publish site (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
